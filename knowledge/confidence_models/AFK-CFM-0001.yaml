id: AFK-CFM-0001
type: confidence_model
name: Evidence-weighted confidence v1
version: 1.0.0
status: hypothesis
owner: chief_epistemologist
description: The active confidence model (extracted verbatim from M3.2 evidence_intel).
formula: 'per-dimension: questionnaire_coverage * 0.4 + (evidence_kinds_present/kinds_useful) * 0.6 *
  avg_data_quality; dimensions with no useful evidence kind: questionnaire_coverage * 0.7; overall = mean(per-dimension)'
rationale: Self-reported answers are hypotheses and cap at 40%; measured evidence supplies the remainder,
  scaled by data quality.
questionnaire_ceiling: 0.4
todos:
